# Dependabot opens pull requests when newer versions of dependencies are
# released. Your CI (lint, tests, Bandit, Gitleaks, Trivy, Docker build)
# runs on each PR branch, so a green PR is safe to merge.
version: 2

updates:
  # Backend Python dependencies (backend/requirements*.txt, fully pinned)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # flake8 pins an exact pyflakes/pycodestyle range per release (e.g.
      # flake8 7.4.1 needs pyflakes>=4.0.0,<4.1.0), so they must move
      # together or pip fails with ResolutionImpossible. Listed first so
      # these packages land here instead of the catch-all group below.
      lint-tools:
        patterns: ["flake8", "pyflakes", "pycodestyle", "mccabe"]
      backend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # passlib 1.7.4 is incompatible with bcrypt >= 4.1 (breaks password
      # hashing), so bcrypt stays pinned until passlib is replaced.
      - dependency-name: "bcrypt"
    labels: ["dependencies", "backend"]

  # Frontend npm dependencies (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "frontend"]

  # Base image in backend/Dockerfile (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]

  # GitHub Actions versions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
