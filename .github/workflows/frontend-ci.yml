name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # No `paths` filter on pull requests: a required status check that is
  # skipped by a path filter never reports, which would block the merge.
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # "build" runs `tsc -b` (type-check) and then `vite build`.
      - name: Type-check and build
        run: npm run build

  audit:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only; fails on HIGH or CRITICAL advisories.
      - name: npm audit
        run: npm audit --audit-level=high --omit=dev
