# Render Blueprint — provisions the ResumeIQ backend + its Postgres
# database together. Deploy with: Render dashboard -> New -> Blueprint,
# pointing at this repo. Secrets (SECRET_KEY, AI provider keys) are left
# for you to fill in in the Render dashboard rather than committed here.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: docker
    name: resumeiq-backend
    # dockerfilePath / dockerContext are relative to rootDir (not the repo root).
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Port the container listens on. Pinned explicitly so it can't
      # drift from Render's expectation (the Dockerfile CMD binds to
      # $PORT).
      - key: PORT
        value: "10000"

      # Render injects its own Postgres connection string here (scheme
      # `postgresql://`); app/db/session.py normalizes that to the
      # `postgresql+psycopg://` dialect this project actually installs.
      - key: DATABASE_URL
        fromDatabase:
          name: resumeiq-db
          property: connectionString

      # Generated once by Render on first deploy and kept stable across
      # redeploys — existing JWTs stay valid between deploys.
      - key: SECRET_KEY
        generateValue: true

      # Set these in the Render dashboard after the first deploy —
      # sync: false means Render won't try to source them from this file
      # (and won't ever show them back to you in plain text here).
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Free model verified end-to-end for cover letters. Change it here (not in
      # the dashboard) — Blueprint sync overwrites dashboard edits to keys
      # that have a value in this file.
      - key: OPENROUTER_MODEL
        value: recursive/flint-v1.0:free

databases:
  - name: resumeiq-db
    plan: free
    databaseName: resumeiq
    user: resumeiq
