# Render Blueprint — provisions the ResumeIQ backend. The database now
# lives on Neon (see DATABASE_URL below). Deploy with: Render dashboard -> New -> Blueprint,
# pointing at this repo. Secrets (SECRET_KEY, AI provider keys) are left
# for you to fill in in the Render dashboard rather than committed here.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: docker
    name: resumeiq-backend
    # dockerfilePath / dockerContext are relative to rootDir (not the repo root).
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Port the container listens on. Pinned explicitly so it can't
      # drift from Render's expectation (the Dockerfile CMD binds to
      # $PORT).
      - key: PORT
        value: "10000"

      # Neon Postgres (direct, non-pooled connection string, with
      # ?sslmode=require). Set it in the Render dashboard -- sync: false
      # keeps the password out of this file. app/db/session.py rewrites
      # the `postgresql://` scheme to `postgresql+psycopg://`.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render on first deploy and kept stable across
      # redeploys — existing JWTs stay valid between deploys.
      - key: SECRET_KEY
        generateValue: true

      # Set these in the Render dashboard after the first deploy —
      # sync: false means Render won't try to source them from this file
      # (and won't ever show them back to you in plain text here).
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Render's proxy is the only way into this service, so the original
      # client address is taken from X-Forwarded-For for rate limiting.
      # Without it every visitor shares the proxy's address and one
      # rate-limit bucket (see app/core/limiter.py).
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Free model verified end-to-end for cover letters. Change it here (not in
      # the dashboard) — Blueprint sync overwrites dashboard edits to keys
      # that have a value in this file.
      - key: OPENROUTER_MODEL
        value: recursive/flint-v1.0:free

# Legacy free Postgres, no longer referenced by the service. Delete this
# block (and the database in the dashboard) once Neon is verified.
databases:
  - name: resumeiq-db
    plan: free
    databaseName: resumeiq
    user: resumeiq
